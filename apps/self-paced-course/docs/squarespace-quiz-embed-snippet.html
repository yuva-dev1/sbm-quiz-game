<!--
  Srimad Bhagavatam Self-Paced Course — weekly quiz embed.
  Paste this whole block into a Squarespace Code Block on the "Week N Quiz" lesson.
  Set WEEK below (1, 2, ...). Update COURSE_APP once the quiz. subdomain is live.

  Note: Squarespace does not run Code Blocks in the page editor's preview —
  you'll see a placeholder there. Verify on the published page while signed in
  as a course member.
-->
<div id="sbm-quiz"></div>

<style>
  #sbm-quiz { max-width: 760px; margin: 0 auto; }
  #sbm-quiz iframe { width: 100%; border: 0; display: block; min-height: 320px; transition: height .15s ease; }
  #sbm-quiz .sbm-note {
    max-width: 480px; margin: 24px auto; padding: 16px 18px; border-radius: 10px;
    background: #f4f2ec; color: #5d6270; font-size: 15px; text-align: center;
  }
</style>

<script>
  (function () {
    var WEEK = 1;
    // Once the DNS record is live, use: https://quiz.srimadbhagavatamcourse.org
    var COURSE_APP = 'https://bhagavatham-self-paced-course-876193044983.us-central1.run.app';

    var mount = document.getElementById('sbm-quiz');

    function getCookie(name) {
      var m = document.cookie.split(';').map(function (c) { return c.trim(); })
        .find(function (c) { return c.indexOf(name + '=') === 0; });
      return m ? decodeURIComponent(m.slice(name.length + 1)) : null;
    }

    var info = {};
    try { info = JSON.parse(getCookie('SiteUserInfo') || '{}'); } catch (e) {}

    if (!info.authenticated || !info.siteUserId) {
      // In the Squarespace editor the page is rendered inside a frame and has
      // no member session — show a labelled placeholder there, and the real
      // sign-in prompt to a logged-out visitor on the live page.
      var inEditor = window.self !== window.top;
      mount.innerHTML = '<div class="sbm-note">' + (inEditor
        ? 'Week ' + WEEK + ' quiz — renders here for signed-in students on the published page.'
        : 'Please sign in to the course to take this quiz.') + '</div>';
      return;
    }

    // "Back to the course" should land on the course overview page, not this
    // individual lesson. Derive it from the current path (…/english-6month-selfpaced).
    var m = window.location.pathname.match(/^(.*\/english-6month-selfpaced)(\/|$)/);
    var courseHome = window.location.origin + (m ? m[1] : '/english-6month-selfpaced');

    var src = COURSE_APP + '/q/' + WEEK
      + '?sid=' + encodeURIComponent(info.siteUserId)
      + '&back=' + encodeURIComponent(courseHome);

    var iframe = document.createElement('iframe');
    iframe.src = src;
    iframe.title = 'Week ' + WEEK + ' quiz';
    iframe.setAttribute('scrolling', 'no');
    mount.appendChild(iframe);

    window.addEventListener('message', function (e) {
      if (COURSE_APP.indexOf(e.origin) !== 0) return;
      if (e.data && e.data.type === 'sbm-quiz-height' && e.data.height) {
        iframe.style.height = (e.data.height + 24) + 'px';
      }
    });
  })();
</script>
